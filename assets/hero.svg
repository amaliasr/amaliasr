<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Hi, I'm Amalia, Product Manager">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/><stop offset=".6" stop-color="#e3f3ff"/><stop offset="1" stop-color="#fdf0f7"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#5b8def"><animate attributeName="stop-color" values="#5b8def;#ff7ab6;#5b8def" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff7ab6"><animate attributeName="stop-color" values="#ff7ab6;#5b8def;#ff7ab6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7aa8e0" flood-opacity=".35"/></filter>
    <clipPath id="card"><rect width="1200" height="420" rx="32"/></clipPath>
    <style>
      .t { font-family: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', 'Segoe UI', sans-serif; }
      @keyframes rise { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
      @keyframes wave { 0%,60%,100% { transform:rotate(0); } 10%,30% { transform:rotate(18deg); } 20%,40% { transform:rotate(-10deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
      .a1 { opacity:0; animation:rise .8s ease-out .2s forwards; }
      .a2 { opacity:0; animation:rise .8s ease-out .5s forwards; }
      .a3 { opacity:0; animation:rise .8s ease-out .8s forwards; }
      .a4 { opacity:0; animation:rise .8s ease-out 1.1s forwards; }
      .hand { transform-box:fill-box; transform-origin:70% 80%; animation:wave 2.4s ease-in-out 1s infinite; }
      .bob { animation:bob 4s ease-in-out infinite; }
      .cur { animation:blink 1s steps(1) infinite; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#sky)"/>
    <g><g transform="translate(0 70) scale(0.9)" opacity="0.85"><ellipse cx="0" cy="18" rx="62" ry="20" fill="#fff"/><circle cx="-30" cy="6" r="24" fill="#fff"/><circle cx="2" cy="-6" r="32" fill="#fff"/><circle cx="34" cy="8" r="22" fill="#fff"/></g><animateTransform attributeName="transform" type="translate" values="-180 0;1380 0" dur="38s" begin="-5s" repeatCount="indefinite"/></g>
    <g><g transform="translate(0 330) scale(1.3)" opacity="0.9"><ellipse cx="0" cy="18" rx="62" ry="20" fill="#fff"/><circle cx="-30" cy="6" r="24" fill="#fff"/><circle cx="2" cy="-6" r="32" fill="#fff"/><circle cx="34" cy="8" r="22" fill="#fff"/></g><animateTransform attributeName="transform" type="translate" values="-180 0;1380 0" dur="52s" begin="-30s" repeatCount="indefinite"/></g>
    <g><g transform="translate(0 170) scale(0.6)" opacity="0.7"><ellipse cx="0" cy="18" rx="62" ry="20" fill="#fff"/><circle cx="-30" cy="6" r="24" fill="#fff"/><circle cx="2" cy="-6" r="32" fill="#fff"/><circle cx="34" cy="8" r="22" fill="#fff"/></g><animateTransform attributeName="transform" type="translate" values="-180 0;1380 0" dur="30s" begin="-18s" repeatCount="indefinite"/></g>
    <g><g transform="translate(0 380) scale(0.8)" opacity="0.8"><ellipse cx="0" cy="18" rx="62" ry="20" fill="#fff"/><circle cx="-30" cy="6" r="24" fill="#fff"/><circle cx="2" cy="-6" r="32" fill="#fff"/><circle cx="34" cy="8" r="22" fill="#fff"/></g><animateTransform attributeName="transform" type="translate" values="-180 0;1380 0" dur="44s" begin="-8s" repeatCount="indefinite"/></g>
    <g transform="translate(70 60)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#ff8fbf"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values=".6;1.2;.6" dur="2.6s" begin="0s" repeatCount="indefinite"/></path></g><g transform="translate(520 70)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#ffd76e"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values=".6;1.2;.6" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></path></g><g transform="translate(640 330)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#7cc4ff"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values=".6;1.2;.6" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></path></g><g transform="translate(820 60)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#ff8fbf"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" begin="0.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values=".6;1.2;.6" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></path></g><g transform="translate(1150 120)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#ffd76e"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="1.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values=".6;1.2;.6" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></path></g><g transform="translate(420 380)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#ff8fbf"><animate attributeName="opacity" values=".2;1;.2" dur="3.0s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values=".6;1.2;.6" dur="3.0s" begin="0.9s" repeatCount="indefinite"/></path></g><g transform="translate(1160 360)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#7cc4ff"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" begin="0.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values=".6;1.2;.6" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></path></g>

    <!-- mascot: Puffy the little cloud (original) -->
    <g class="bob" filter="url(#soft)">
      <ellipse cx="1010" cy="290" rx="150" ry="52" fill="#fff"/>
      <circle cx="905" cy="255" r="62" fill="#fff"/>
      <circle cx="1000" cy="215" r="88" fill="#fff"/>
      <circle cx="1100" cy="250" r="66" fill="#fff"/>
      <ellipse cx="968" cy="252" rx="7" ry="10" fill="#3b5b8c">
        <animate attributeName="ry" values="10;10;1;10" keyTimes="0;.9;.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1042" cy="252" rx="7" ry="10" fill="#3b5b8c">
        <animate attributeName="ry" values="10;10;1;10" keyTimes="0;.9;.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="971" cy="248" r="2.5" fill="#fff"/><circle cx="1045" cy="248" r="2.5" fill="#fff"/>
      <path d="M994 270 Q1005 282 1016 270" fill="none" stroke="#3b5b8c" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="945" cy="274" rx="14" ry="8" fill="#ff8fbf" opacity=".55"/>
      <ellipse cx="1065" cy="274" rx="14" ry="8" fill="#ff8fbf" opacity=".55"/>
      <g transform="translate(1092 158)">
        <path d="M0 -14 L4 -4 L14 -3 L6 4 L9 14 L0 8 L-9 14 L-6 4 L-14 -3 L-4 -4Z" fill="#ffd76e">
          <animateTransform attributeName="transform" type="rotate" values="-12;12;-12" dur="3s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    <g opacity="0"><animateTransform attributeName="transform" type="translate" values="950 150;930 40" dur="3.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0s" repeatCount="indefinite"/><path d="M0 10 C-14 0 -22 -7 -22 -15 C-22 -20.5 -17.5 -24 -12.5 -24 C-9 -24 -6 -22 0 -17 C6 -22 9 -24 12.5 -24 C17.5 -24 22 -20.5 22 -15 C22 -7 14 0 0 10 Z" fill="#ff8fbf" transform="scale(0.5)"/></g><g opacity="0"><animateTransform attributeName="transform" type="translate" values="1040 150;1055 40" dur="3.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/><path d="M0 10 C-14 0 -22 -7 -22 -15 C-22 -20.5 -17.5 -24 -12.5 -24 C-9 -24 -6 -22 0 -17 C6 -22 9 -24 12.5 -24 C17.5 -24 22 -20.5 22 -15 C22 -7 14 0 0 10 Z" fill="#ffb3d1" transform="scale(0.4)"/></g><g opacity="0"><animateTransform attributeName="transform" type="translate" values="1090 150;1080 40" dur="3.6s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/><path d="M0 10 C-14 0 -22 -7 -22 -15 C-22 -20.5 -17.5 -24 -12.5 -24 C-9 -24 -6 -22 0 -17 C6 -22 9 -24 12.5 -24 C17.5 -24 22 -20.5 22 -15 C22 -7 14 0 0 10 Z" fill="#ff8fbf" transform="scale(0.35)"/></g>

    <g class="a1"><text x="80" y="120" class="t" font-size="24" font-weight="500" fill="#6f8fbf" letter-spacing="2">Halo, dunia!</text>
      <text class="hand" x="252" y="122" font-size="28">👋</text></g>
    <text class="a2 t" x="76" y="212" font-size="92" font-weight="700" fill="url(#name)">I'm Amalia</text>
    <text class="a3 t" x="80" y="264" font-size="30" font-weight="500" fill="#3b5b8c">Product Manager · Builder · Dreamer</text>
    <g class="a4">
      <rect x="80" y="296" width="520" height="52" rx="26" fill="#fff" fill-opacity=".8" stroke="#7cc4ff" stroke-opacity=".5" stroke-width="2"/>
      <text x="108" y="330" class="t" font-size="21" font-weight="500" fill="#3b5b8c">turning ideas into products people love ♡<tspan class="cur" fill="#ff8fbf"> |</tspan></text>
    </g>
  </g>
</svg>
